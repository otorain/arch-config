# Hyprlock — catppuccin mocha palette

general {
    hide_cursor = true
    grace = 0
}

background {
    color = rgb(1e1e2e)
    # To use a blurred wallpaper instead of a solid color, uncomment:
    # path = ~/.config/hypr/wallpaper.jpg
    # blur_passes = 2
}

input-field {
    size = 350, 60
    outline_thickness = 3
    rounding = 30

    outer_color = rgb(89b4fa)      # ring-color
    inner_color = rgb(1e1e2e)      # inside-color
    font_color = rgb(cdd6f4)       # time-color
    check_color = rgb(89dceb)      # ringver-color
    fail_color = rgb(f38ba8)       # ringwrong-color

    fade_on_empty = false
    placeholder_text = <span foreground="##7f849c">输入密码…</span>

    dots_spacing = 0.3
    dots_center = true

    position = 0, -40
    halign = center
    valign = center
}

# Clock: --time-str '%H:%M'
label {
    text = $TIME
    color = rgb(cdd6f4)
    font_size = 72
    font_family = CaskaydiaCove NFM

    position = 0, 120
    halign = center
    valign = center
}

# Date: --date-str '%Y-%m-%d %A'
label {
    text = cmd[update:60000] date +"%Y-%m-%d %A"
    color = rgb(cdd6f4)
    font_size = 20
    font_family = CaskaydiaCove NFM

    position = 0, 60
    halign = center
    valign = center
}
