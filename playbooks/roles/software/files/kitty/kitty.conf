# kitty config
# Docs: https://sw.kovidgoyal.net/kitty/conf.html

# catppuccin mocha theme (from kitty-themes, local copy)
include Catppuccin-Mocha.conf

# Shell integration is sourced and configured manually
shell_integration no-rc

# URL handling: detect mailto: (and other) links and open them with the system
# handler. open_url_with default = xdg-open, which routes mailto: to the Gmail
# web app through the x-scheme-handler/mailto default we configure in mimeapps.
# NOTE: kitty underlines a detected link but does NOT switch to a pointer cursor;
# open a link with Ctrl+Shift+click (or plain click, with the click_interval delay).
detect_urls yes
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
open_url_with default

adjust_line_height 120%
background_opacity 0.98
enable_audio_bell no
font_family CaskaydiaCove NFM
font_size 12
scrollback_lines 65535
window_padding_width 6
