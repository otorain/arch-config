# Pyprland scratchpads — https://hyprland-community.github.io/pyprland/scratchpads.html
# process_tracking = false: chrome --app delegates to an already-running
# instance; the spawned PID exits at once. Also forces lazy.
# smart_focus = true: hide refocuses the window that was focused before the
# scratchpad was shown; without it Hyprland focuses the window sitting at the
# scratchpad's centered position instead.

[pyprland]
plugins = ["scratchpads"]

[scratchpads.deepseek]
command = "google-chrome-stable --app=https://chat.deepseek.com"
class = "chrome-chat.deepseek.com__-Default"
process_tracking = false
animation = ""
size = "59% 69%"
margin = 180
smart_focus = true

[scratchpads.kimi]
command = "google-chrome-stable --app=https://www.kimi.com"
class = "chrome-www.kimi.com__-Default"
process_tracking = false
animation = ""
size = "63% 69%"
margin = 180
smart_focus = true

[scratchpads.wechat]
# command = "" (the field is required): wechat swaps its login window for the
# main window, and only command-less scratchpads re-resolve their window by
# class on every show.
# pinned = false: wechat recreates its window on its own, and pypr's blind
# pin-toggle on hide would pin the new window, showing it on every workspace.
# size = "": keep wechat's own window size; pypr's default is 80% 80%.
command = ""
class = "wechat"
pinned = false
size = ""
animation = ""
margin = 180
smart_focus = true
