# Hyprpaper configuration
# The wallpaper file is copied to ~/.config/hypr/wallpaper.jpg by install.sh
# 0.8+ new syntax: preload is gone, wallpaper is now a block; empty monitor = all monitors

splash = false
ipc = on

wallpaper {
    monitor =
    path = ~/.config/hypr/wallpaper.jpg
    fit_mode = cover
}
