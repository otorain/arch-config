---
- name: Deploy wechat desktop override (QT_SCALE_FACTOR from host_vars)
  ansible.builtin.template:
    src: gui-apps/wechat.desktop.j2
    dest: "{{ home }}/.local/share/applications/wechat.desktop"
  notify: Update desktop database

- name: Deploy mimeapps.list (default applications for mime types)
  ansible.builtin.copy:
    src: gui-apps/mimeapps.list
    dest: "{{ home }}/.config/mimeapps.list"
