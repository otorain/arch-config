---
# All AUR packages. Requires yay (yay.yml).
# Per-package probe + warn-and-continue so one bad package never fails the run.
- name: Install AUR packages
  ansible.builtin.include_tasks: _aur_one.yml
  loop:
    # === Browsers ===
    - google-chrome
    # === JetBrains IDE ===
    - pycharm
    - rubymine
    # === Messaging ===
    - wechat-bin
    # === Office / Dictionaries ===
    - wps-office-cn
    - goldendict-ng
    # === mpv scripts ===
    - mpv-uosc
    - mpv-thumbfast-git
    - mpv-sponsorblock
    # === AI coding tools ===
    - opencode-bin
    - herdr-bin
    - kimi-code
    # === IME dictionaries ===
    - rime-ice-git
    # === Dev tools ===
    - terraform-ls
    - vscode-langservers-extracted
    - prettierd
    - vagrant
    # === Themes ===
    - colloid-catppuccin-gtk-theme-git
    - catppuccin-cursors-mocha
    - catppuccin-sddm-theme-mocha
    - rofi-power-menu
    # === Misc ===
    - dropbox
    - virtualbox-ext-oracle
  loop_control:
    loop_var: pkg
