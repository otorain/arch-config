---
- name: Install oh-my-zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ home }}/.oh-my-zsh"
    depth: 1
    update: false

- name: Deploy zshrc skeleton (once; never overwrite — user owns it after first deploy)
  ansible.builtin.copy:
    src: zsh/zshrc
    dest: "{{ home }}/.zshrc"
    force: false

- name: Check zshrc sources the conf.d fragments
  ansible.builtin.command: "grep -q zsh/conf.d \"{{ home }}/.zshrc\""
  register: zshrc_conf_d
  changed_when: false
  failed_when: false

- name: Warn if zshrc does not source the conf.d fragments
  ansible.builtin.debug:
    msg: "~/.zshrc does not source ~/.config/zsh/conf.d/*.zsh — app shell integrations will not load. Add: for f in ~/.config/zsh/conf.d/*.zsh(N); do source $f; done"
  when: zshrc_conf_d.rc != 0

- name: Deploy zsh conf.d fragments
  ansible.builtin.copy:
    src: zsh/conf.d/
    dest: "{{ home }}/.config/zsh/conf.d/"

- name: Deploy zsh syntax highlighting theme
  ansible.builtin.copy:
    src: zsh/catppuccin_mocha-zsh-syntax-highlighting.zsh
    dest: "{{ home }}/.local/share/catppuccin_mocha-zsh-syntax-highlighting.zsh"
