---
- name: Install oh-my-zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ home }}/.oh-my-zsh"
    depth: 1
    update: false

- name: Deploy zsh files (.zshrc, conf.d fragments, highlight theme)
  ansible.builtin.copy:
    src: apps/zsh/
    dest: "{{ home }}/"
