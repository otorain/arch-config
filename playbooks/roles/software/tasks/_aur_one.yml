---
- name: "AUR: check installed: {{ pkg }}"
  ansible.builtin.command: "yay -Qi {{ pkg }}"
  register: aur_qi
  changed_when: false
  failed_when: false
  check_mode: false  # read-only probe; must run so `when:` works under --check

- name: "AUR: install if missing: {{ pkg }}"
  when: aur_qi.rc != 0
  block:
    - name: "AUR: probe availability: {{ pkg }}"
      ansible.builtin.command: "yay -Si {{ pkg }}"
      register: aur_si
      changed_when: false
      failed_when: false
      check_mode: false  # read-only probe; must run so `when:` works under --check

    - name: "AUR: warn if not resolvable: {{ pkg }}"
      ansible.builtin.debug:
        msg: "not in AUR (skipped): {{ pkg }}"
      when: aur_si.rc != 0

    - name: "AUR: install: {{ pkg }}"
      become: true
      become_user: aur_builder
      # Ansible's sudo become does not pass -H: set HOME explicitly, otherwise
      # yay would write its cache into the login user's ~/.cache (denied).
      environment:
        HOME: /home/aur_builder
      ansible.builtin.command: "yay -S --needed --noconfirm {{ pkg }}"
      when: aur_si.rc == 0
      register: aur_install
      failed_when: false

    - name: "AUR: warn on failure: {{ pkg }}"
      ansible.builtin.debug:
        msg: |
          install failed, handle manually: {{ pkg }}
          last stderr lines:
          {{ (aur_install.stderr_lines | default([]))[-10:] | join('\n') }}
      # default(0): in --check mode the install command is skipped and has no rc
      when: aur_si.rc == 0 and aur_install.rc | default(0) != 0
