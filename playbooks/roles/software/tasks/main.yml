---
# Order-sensitive infrastructure first: _pacman → yay → _aur.
# yay needs base-devel + git from _pacman; _aur needs the yay binary.
# App files below may be ordered freely; each deploys config only
# (packages live in _pacman.yml / _aur.yml).
# Every include pairs outer `tags:` (selects the include task itself)
# with module-arg `apply: tags:` (propagates to the included tasks) —
# plain `tags:` on a dynamic include_tasks does NOT reach inner tasks.
# Note: `apply` must be nested in the module args; as a task-level
# keyword it is rejected ("conflicting action statements", core 2.21).
- name: Packages (official repos)
  ansible.builtin.include_tasks:
    file: _pacman.yml
    apply:
      tags: packages
  tags: packages

- name: yay bootstrap
  ansible.builtin.include_tasks:
    file: yay.yml
    apply:
      tags: [yay, aur]
  tags: [yay, aur]

- name: Packages (AUR)
  ansible.builtin.include_tasks:
    file: _aur.yml
    apply:
      tags: aur
  tags: aur

- name: "App: cli-tools"
  ansible.builtin.include_tasks:
