---
- name: Deploy gmail desktop entry (mailto handler; Exec uses {{ home }})
  ansible.builtin.template:
    src: gmail/gmail.desktop.j2
    dest: "{{ home }}/.local/share/applications/gmail.desktop"
  notify: Update desktop database

- name: Deploy gmail mailto handler script
  ansible.builtin.copy:
    src: gmail/gmail-mailto
    dest: "{{ home }}/.local/bin/gmail-mailto"
    mode: "0755"
  notify: Update desktop database

- name: Deploy gmail icon
  ansible.builtin.copy:
    src: gmail/gmail.png
    dest: "{{ home }}/.local/share/icons/hicolor/256x256/apps/gmail.png"
  notify: Update icon cache
