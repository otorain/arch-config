---
- name: Deploy waybar config (rendered from host_vars)
  ansible.builtin.template:
    src: waybar/config.jsonc.j2
    dest: "{{ home }}/.config/waybar/config.jsonc"
  notify: Reload waybar

- name: Deploy waybar style
  ansible.builtin.copy:
    src: waybar/style.css
    dest: "{{ home }}/.config/waybar/style.css"
  notify: Reload waybar

- name: Deploy waybar popup scripts (weather.py / calendar.py / waybar_geom.py)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ home }}/.local/bin/{{ item | basename }}"
    mode: preserve
  with_fileglob:
    - "waybar/*.py"
  notify: Reload waybar
