---
home: "{{ ansible_env.HOME }}"
uid: "{{ ansible_user_uid }}"
timezone: Asia/Shanghai
gtk_theme: Colloid-Dark-Catppuccin
icon_theme: Papirus-Dark
gtk_font: Noto Sans 12
npm_globals:
  - "@openai/codex"
  - "@mariozechner/pi-coding-agent"
  - "@deepseek-ai/dsh"
system_units:
  - NetworkManager
  - bluetooth
  - sshd
  - fail2ban
  - cups.socket
  - avahi-daemon
  - udisks2
  - earlyoom
  - fstrim.timer
  - docker.socket
  - libvirtd.socket
  - sddm
user_units:
  - pipewire
  - pipewire-pulse
  - wireplumber
