---
home: "{{ ansible_facts['env']['HOME'] }}"
uid: "{{ ansible_facts['user_uid'] }}"
# Pin the module interpreter: auto-discovery picks the login user's mise
# python, which aur_builder (non-root become) cannot execute (rc 126)
ansible_python_interpreter: /usr/bin/python3
timezone: Asia/Shanghai
gtk_theme: Colloid-Dark-Catppuccin
icon_theme: Papirus-Dark
gtk_font: Noto Sans 12
npm_globals:
  - "@openai/codex"
  - "@mariozechner/pi-coding-agent"
  - "@deepseek-ai/dsh"
system_units:
  - NetworkManager
  - bluetooth
  - sshd
  - fail2ban
  - cups.socket
  - avahi-daemon
  - udisks2
  - earlyoom
  - fstrim.timer
  - docker.socket
  - libvirtd.socket
  - sddm
  - k3s
user_units:
  - pipewire
  - pipewire-pulse
  - wireplumber
